name: Fantasy report

on:
  schedule:
    - cron: "0 */3 * * *" # every 3 hours
  workflow_dispatch: # "Run workflow" button on the Actions tab
  push:
    branches: [main] # rebuild right away when the code changes

permissions:
  contents: write # only for the keep-alive commit
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build report
        run: node fantasy.mjs
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          SEASON: "2026"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled runs after 60 days without a commit.
      - name: Keep schedule alive
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 3888000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keep schedule alive"
            git push
          fi
