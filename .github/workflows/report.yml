name: Fantasy report

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes, the fastest GitHub allows (it sometimes runs these late)
  workflow_dispatch: # "Run workflow" button, and cron-job.org every 3 minutes
  push:
    branches: [main] # rebuild right away when the code changes

permissions:
  contents: write # for the 3-hourly refresh commit
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # wait in line, so a slow run still finishes and publishes

jobs:
  report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://mrbrofo.github.io/Fantasy-app/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: node check.mjs # lineup-lock self-check; a failure stops the run before anything is published

      # What alerts were already sent, carried from the last run (newest cache whose key starts with "alerts-")
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: alerts-${{ github.run_id }}
          restore-keys: alerts-

      - name: Build report
        run: node fantasy.mjs
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          PUSH_SUB: ${{ secrets.PUSH_SUB }} # phone alerts: code from the app's "Turn on alerts"
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }} # unlocks the site; not set = site not locked
          SEASON: "2026"

      # One-time check of the FantasyPros key (see fp-probe.mjs); a failure here never stops the site
      - name: FantasyPros probe
        run: node fp-probe.mjs || true
        env:
          FANTASYPROS_KEY: ${{ secrets.FANTASYPROS_KEY }}
          SEASON: "2026"

      # Saved right after the build (before deploy), so a failed deploy never forgets alerts already sent
      - uses: actions/cache/save@v4
        if: always() # also after a failed build, so the "stopped updating" alert goes out once a day, not every run
        with:
          path: state
          key: alerts-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4

      # After ~4 hours of deploys from the same commit, Pages keeps serving an old build (froze 2026-10-22 and
      # 10-23; only a new commit fixed it). So start a new commit every 3 hours; cron-job.org's next run builds
      # from it (a push made with this token doesn't start a run by itself). Also keeps the schedule from
      # pausing, which GitHub does after 60 days without a commit.
      - name: New commit every 3 hours
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 10800 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Refresh: new commit so Pages keeps taking new builds"
            git push || true # another run may have pushed one first
          fi
