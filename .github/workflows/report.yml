name: Fantasy report

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes, the fastest GitHub allows (it sometimes runs these late)
  workflow_dispatch: # "Run workflow" button, and cron-job.org every 3 minutes
  push:
    branches: [main] # rebuild right away when the code changes

permissions:
  contents: write # only for the keep-alive commit
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # wait in line, so a slow run still finishes and publishes

jobs:
  report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://mrbrofo.github.io/Fantasy-app/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: node check.mjs # lineup-lock self-check; a failure stops the run before anything is published

      # What alerts were already sent, carried from the last run (newest cache whose key starts with "alerts-")
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: alerts-${{ github.run_id }}
          restore-keys: alerts-

      - name: Build report
        run: node fantasy.mjs
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          PUSH_SUB: ${{ secrets.PUSH_SUB }} # phone alerts: code from the app's "Turn on alerts"
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }} # unlocks the site; not set = site not locked
          SEASON: "2026"

      # Saved right after the build (before deploy), so a failed deploy never forgets alerts already sent
      - uses: actions/cache/save@v4
        if: always() # also after a failed build, so the "stopped updating" alert goes out once a day, not every run
        with:
          path: state
          key: alerts-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/configure-pages@v5
      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # deploy-pages names every deploy after the commit, and ~4 hours of deploys under one name makes Pages
      # keep serving an old build (froze 2026-10-22 and 10-23, fixed each time only by a new commit).
      # Deploying through the API gives each run its own name.
      - name: Deploy
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.upload.outputs.artifact_id }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -n "$ARTIFACT" ] || fail "no artifact id"
          oidc=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value) \
            || fail "no OIDC token"
          res=$(jq -n --arg a "$ARTIFACT" --arg v "$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --arg o "$oidc" \
            '{artifact_id: ($a | tonumber), pages_build_version: $v, oidc_token: $o}' \
            | gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments" --input - 2>&1) || fail "create: $res"
          id=$(echo "$res" | jq -r .id)
          for i in $(seq 60); do
            s=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$id" -q .status 2>&1); echo "$s"
            [ "$s" = succeed ] && exit 0
            case "$s" in *failed*|*lost*|*cancelled*|*error*|*Not\ Found*) fail "status: $s";; esac
            sleep 5
          done
          fail "timed out"

      # GitHub pauses scheduled runs after 60 days without a commit.
      - name: Keep schedule alive
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 3888000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keep schedule alive"
            git push
          fi
